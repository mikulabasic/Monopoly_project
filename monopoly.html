<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --table:#1f3346; --table-2:#132131;
  --paper:#eef2f4; --paper-2:#ffffff; --ink:#1b2430; --line:#3a4656; --muted:#56636f;
  --brass:#e2b23c; --cash:#9fe3b8; --danger:#c8372d;
  --side-w:380px;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --text:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--table-2)}
body{min-height:100vh;background:radial-gradient(1100px 760px at 35% 22%,#2c4862 0%,var(--table) 45%,var(--table-2) 100%) no-repeat;color:#e8eef4;font-family:var(--text);font-size:15px;line-height:1.4}
button,input,select{font:inherit}
#app{display:flex;gap:18px;padding:12px;justify-content:center;align-items:flex-start}

/* ---------- board ---------- */
#board{--B:max(540px,min(calc(100vh - 24px),calc(100vw - var(--side-w) - 42px)));--u:calc(var(--B) / 12.2);--tt:150ms;
  width:var(--B);height:var(--B);flex:none;position:relative;display:grid;
  grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:4px;
  box-shadow:0 24px 60px rgba(0,0,0,.45);font-size:calc(var(--u) * .14);line-height:1.12;user-select:none;-webkit-user-select:none}
.sp{position:relative;overflow:hidden;background:var(--paper);box-shadow:0 0 0 .5px var(--line);cursor:pointer;min-width:0;min-height:0}
.sp:hover{background:#fff}
.sp.landed{background:#fff6dc}
/* every street keeps its colour band on the side facing the centre, text stays upright */
.sp .in{position:absolute;inset:0;display:flex;flex-direction:column;text-align:center}
.side-t .in{flex-direction:column-reverse}
.side-l .in{flex-direction:row-reverse}
.side-r .in{flex-direction:row}
.band{flex:none;height:calc(var(--u) * .3);display:flex;align-items:center;justify-content:center;gap:calc(var(--u) * .03)}
.side-b .band{border-bottom:1px solid var(--line)}
.side-t .band{border-top:1px solid var(--line)}
.side-l .band,.side-r .band{height:auto;width:calc(var(--u) * .3);flex-direction:column}
.side-l .band{border-left:1px solid var(--line)}
.side-r .band{border-right:1px solid var(--line)}
.body{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  padding:calc(var(--u) * .07) calc(var(--u) * .05) calc(var(--u) * .18)}
.side-t .body{flex-direction:column-reverse;padding:calc(var(--u) * .18) calc(var(--u) * .05) calc(var(--u) * .07)}
.side-l .body{padding:calc(var(--u) * .06) calc(var(--u) * .05) calc(var(--u) * .06) calc(var(--u) * .19)}
.side-r .body{padding:calc(var(--u) * .06) calc(var(--u) * .19) calc(var(--u) * .06) calc(var(--u) * .05)}
.nm{font-weight:700;font-size:calc(var(--u) * .13);overflow-wrap:anywhere}
.ic{font-size:calc(var(--u) * .36);line-height:1}
.side-l .ic,.side-r .ic{font-size:calc(var(--u) * .27)}
.ic.q{font-family:var(--display);font-weight:800;font-size:calc(var(--u) * .55);color:#b8861a}
.side-l .ic.q,.side-r .ic.q{font-size:calc(var(--u) * .4)}
.pr{font-size:calc(var(--u) * .125);min-height:1em}
.own{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u) * .13)}
.side-t .own{top:0;bottom:auto}
.side-l .own,.side-r .own{top:0;bottom:0;height:auto;width:calc(var(--u) * .13)}
.side-l .own{left:0;right:auto}
.side-r .own{right:0;left:auto}
.house{width:calc(var(--u) * .17);height:calc(var(--u) * .17);background:#1e9b52;border:1px solid #0b4d27;border-radius:2px}
.hotel{width:calc(var(--u) * .46);height:calc(var(--u) * .2);background:#d33a2e;border:1px solid #6b120c;border-radius:2px}
.side-l .hotel,.side-r .hotel{width:calc(var(--u) * .2);height:calc(var(--u) * .46)}
.sp.mort .in::after{content:'Mortgaged';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(45deg,rgba(27,36,48,.62) 0 3px,rgba(27,36,48,.32) 3px 7px);color:#fff;font-weight:700;font-size:calc(var(--u) * .12)}
.corner .cin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u) * .05);text-align:center;padding:calc(var(--u) * .1)}
.corner .big{font-family:var(--display);font-weight:800;font-size:calc(var(--u) * .3);letter-spacing:-.01em;line-height:1}
.corner .ic{font-size:calc(var(--u) * .52);margin:0}
.corner .arrow{font-size:calc(var(--u) * .5);line-height:.8;color:#b8861a;font-weight:800}
.corner small{font-size:calc(var(--u) * .12)}
.jailbox{position:absolute;right:0;top:0;width:68%;height:68%;border-left:2px solid var(--line);border-bottom:2px solid var(--line);
  background:repeating-linear-gradient(90deg,#f5dcae 0 calc(var(--u) * .13),#3a4656 calc(var(--u) * .13) calc(var(--u) * .17));display:flex;align-items:center;justify-content:center}
.jailbox span{background:var(--paper);padding:calc(var(--u) * .03) calc(var(--u) * .07);font-family:var(--display);font-weight:800;font-size:calc(var(--u) * .2);border:1px solid var(--line)}
.jv-l{position:absolute;left:0;top:32%;bottom:0;width:32%;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:calc(var(--u) * .12);font-weight:700}
.jv-b{position:absolute;left:32%;right:0;bottom:0;height:32%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u) * .12);font-weight:700}
.pot{font-weight:700;color:#1f7a45}

/* ---------- centre ---------- */
#center{grid-row:2 / 11;grid-column:2 / 11;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(var(--u) * .28);padding:calc(var(--u) * .3);overflow:hidden;background:linear-gradient(#f7f9fa,#e3e9ed);box-shadow:0 0 0 .5px var(--line)}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:30%;color:var(--ink);opacity:.1;pointer-events:none}
.brand{position:relative;font-family:var(--display);font-weight:800;font-size:calc(var(--u) * .92);line-height:.86;letter-spacing:-.035em;color:var(--ink);text-align:center}
.brand small{display:block;font-family:var(--text);font-size:max(11px,calc(var(--u) * .17));letter-spacing:0;font-weight:400;color:var(--muted);margin-top:.7em;line-height:1.2}
.ctrl{position:relative;z-index:1;width:min(100%,calc(var(--u) * 6.6));background:var(--paper-2);border:2px solid var(--ink);border-radius:12px;
  padding:clamp(10px,calc(var(--u) * .22),16px);box-shadow:0 6px 0 rgba(27,36,48,.14);font-size:clamp(12px,calc(var(--u) * .2),15.5px);
  display:flex;flex-direction:column;gap:clamp(6px,calc(var(--u) * .13),10px);max-height:100%;overflow:auto}
.ctrl-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.who{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.25em;min-width:0}
.who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turnno{color:var(--muted);font-size:.9em;flex:none}
.dot{width:1.7em;height:1.7em;border-radius:50%;background:var(--pc);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ink);display:grid;place-items:center;font-size:.85em;flex:none}
.dice{display:flex;gap:10px;justify-content:center}
.die{width:clamp(34px,calc(var(--u) * .7),54px);aspect-ratio:1;background:#fff;border:2px solid var(--ink);border-radius:22%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:clamp(4px,calc(var(--u) * .08),7px)}
.die i{width:72%;aspect-ratio:1;border-radius:50%;place-self:center}
.die i.on{background:var(--ink)}
.die.roll{transform:rotate(-8deg)}
.die.roll+.die.roll{transform:rotate(9deg)}
.events{display:flex;flex-direction:column;gap:2px;min-height:1.3em}
.events div{color:var(--muted);font-size:.92em}
.events div:first-child{color:var(--ink);font-weight:700;font-size:1em}
.pn{color:var(--pc)}
.prompt{font-size:.98em;border-top:1px solid #dfe5ea;padding-top:clamp(6px,calc(var(--u) * .12),10px)}
.prompt:empty{display:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.acts:empty{display:none}

/* ---------- tokens ---------- */
#tokens{position:absolute;inset:0;pointer-events:none;z-index:5}
.tok{position:absolute;width:calc(var(--u) * .5);height:calc(var(--u) * .5);border-radius:50%;background:var(--pc);border:2px solid #fff;
  box-shadow:0 2px 5px rgba(0,0,0,.45);display:grid;place-items:center;font-size:calc(var(--u) * .27);line-height:1;transform:translate(-50%,-50%);
  transition:left var(--tt) ease,top var(--tt) ease}
.tok.cur{box-shadow:0 0 0 3px var(--brass),0 3px 8px rgba(0,0,0,.55);z-index:2}

/* ---------- buttons ---------- */
.btn{appearance:none;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:.5em .95em;font-weight:700;cursor:pointer;line-height:1.15}
.btn:hover:not(:disabled){background:#f1f4f7}
.btn.primary{background:var(--brass)}
.btn.primary:hover:not(:disabled){background:#efc659}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.sm{padding:.32em .65em;font-size:.86em;border-width:1.5px;border-radius:6px}
.btn:focus-visible,.chip:focus-visible,.sp:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4aa3ff;outline-offset:2px}

/* ---------- side panel ---------- */
#side{width:var(--side-w);flex:none;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px;max-height:calc(100vh - 24px)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar .btn{background:transparent;color:#e8eef4;border-color:rgba(232,238,244,.4);font-weight:600}
.bar .btn:hover:not(:disabled){background:rgba(255,255,255,.08)}
.players{display:flex;flex-direction:column;gap:8px}
.pl{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-left:6px solid var(--pc);border-radius:10px;padding:9px 12px}
.pl.cur{background:rgba(255,255,255,.14);border-color:rgba(226,178,60,.85);border-left-color:var(--pc)}
.pl.out{opacity:.45}
.pl-top{display:flex;align-items:center;gap:8px}
.pl-top .t{width:28px;height:28px;border-radius:50%;background:var(--pc);display:grid;place-items:center;border:2px solid #fff;font-size:15px;flex:none}
.pl-top .n{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;color:#b9c6d3;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:0 7px;flex:none}
.pl-top .cash{font-family:var(--display);font-weight:800;font-size:20px;color:var(--cash);font-variant-numeric:tabular-nums;flex:none}
.pl-sub{font-size:13px;color:#c3cfda;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.grp{display:flex;gap:2px}
.chip{width:15px;height:19px;border-radius:3px;border:1.5px solid var(--gc);background:transparent;cursor:pointer;padding:0;font-size:10px;font-weight:700;color:#fff;line-height:1;text-shadow:0 0 2px #000}
.chip.mine{background:var(--gc)}
.chip.mine.m{background:repeating-linear-gradient(45deg,var(--gc) 0 3px,transparent 3px 6px)}
.chip.not{opacity:.28}
.log{flex:1;min-height:170px;overflow:auto;background:rgba(0,0,0,.2);border-radius:10px;padding:6px 12px;font-size:13.5px}
.log div{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.log .pn{color:var(--pl)}
.log .lt{color:#8fa1b3}

/* ---------- modals ---------- */
#modals .ov{position:fixed;inset:0;background:rgba(9,16,24,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--paper);color:var(--ink);border-radius:14px;border:2px solid var(--ink);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.md.wide{width:min(880px,100%)}
.md h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.015em;margin:0 0 12px;line-height:1.1}
.md h3{font-size:16px;margin:0 0 8px}
.md p{margin:0 0 10px}
.md .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.md .row.split{justify-content:space-between}
.muted{color:var(--muted)}
.err{color:var(--danger);font-weight:700}
.ok{color:#1f7a45;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:5px;font-weight:700;white-space:nowrap}
.badge .bt{width:1.45em;height:1.45em;border-radius:50%;background:var(--pc);display:inline-grid;place-items:center;font-size:.8em;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--ink)}
.deedwrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.deedside{flex:1;min-width:200px}
.deed{width:250px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;flex:none;font-size:14px}
.deed .dh{padding:10px 12px;text-align:center;border-bottom:2px solid var(--ink)}
.deed .dh small{display:block;font-size:12px;opacity:.85}
.deed .dh b{font-family:var(--display);font-size:21px;line-height:1.05;display:block;letter-spacing:-.01em}
.deed table{width:100%;border-collapse:collapse;margin:4px 0}
.deed td{padding:3px 12px}
.deed td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.deed tr.now td{background:#fff1c7;font-weight:700}
.deed .df{padding:8px 12px;border-top:1px solid #d5dbe0;font-size:13px;color:var(--muted)}
.mbtns{display:flex;flex-wrap:wrap;gap:6px}
.mg{display:flex;flex-direction:column;gap:12px}
.mg-g{border:1.5px solid #c6ced6;border-radius:10px;overflow:hidden;background:#fff}
.mg-gh{display:flex;align-items:center;gap:8px;padding:7px 12px;font-weight:700;border-bottom:1px solid #e0e5ea}
.mg-gh i{width:14px;height:14px;border-radius:3px;background:var(--gc);flex:none}
.mg-gh span{font-weight:400;color:var(--muted);font-size:13px}
.mg-r{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #eef1f4}
.mg-r:first-of-type{border-top:0}
.mg-r .st{font-size:13px;color:var(--muted)}
.mg-r .mbtns{justify-content:flex-end}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
.stats b{font-variant-numeric:tabular-nums}
.tr-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tr-top select{padding:6px 8px;border:1.5px solid var(--ink);border-radius:6px;background:#fff}
.tr-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tr-col{border:1.5px solid #c6ced6;border-radius:10px;padding:10px 12px;background:#fff}
.tr-col h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tr-item{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px;cursor:pointer}
.tr-item.dis{opacity:.45;cursor:not-allowed}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--gc);flex:none;vertical-align:-1px;margin-right:4px}
.tr-cash{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.tr-cash input{width:110px;padding:6px 8px;border:1.5px solid var(--ink);border-radius:6px}
.tr-sum{background:#fff;border-radius:10px;padding:10px 14px;border:1.5px dashed #95a2ae;margin-top:4px}
.tr-sum p{margin:4px 0}
.fortune{background:#fbe7ad}.community{background:#cfe7f6}
.cardv{border:2px solid var(--ink);border-radius:12px;padding:22px 22px 26px;text-align:center}
.cardv .ci{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.cardv .cn{font-family:var(--display);font-weight:800;font-size:15px;margin:6px 0 12px;color:var(--muted)}
.cardv .ct{font-size:19px;line-height:1.35}
.auc-st{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.auc-high{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.bidders{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:6px 0 10px}
.bidders .gone{opacity:.4;text-decoration:line-through}
.bidbox{border-top:1px solid #d5dbe0;padding-top:12px}
.bidrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.bidrow input{width:110px;padding:7px 8px;border:1.5px solid var(--ink);border-radius:6px}
.seat{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #dbe1e6}
.seat .tk{width:42px;height:42px;border-radius:50%;background:var(--pc);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--ink);display:grid;place-items:center;font-size:21px;cursor:pointer;padding:0}
.seat input{width:100%;padding:8px 10px;border:1.5px solid var(--ink);border-radius:7px;background:#fff;min-width:0}
.seat.off .tk,.seat.off input{opacity:.35}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:7px 10px;cursor:pointer;font-weight:700;color:var(--ink);font-size:14px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opts label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.opts input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--ink)}
.optrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rules li{margin-bottom:6px}
.stand{width:100%;border-collapse:collapse;margin-top:6px}
.stand td,.stand th{padding:6px 8px;border-bottom:1px solid #dbe1e6;text-align:left}
.stand td:not(:first-child),.stand th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}

@media (max-width:980px){
  #app{flex-direction:column;align-items:center;padding:8px}
  #board{--B:min(calc(100vw - 16px),760px)}
  #side{width:100%;max-width:760px;position:static;max-height:none}
  .log{max-height:340px}
}
@media (max-width:640px){
  .tr-cols{grid-template-columns:1fr}
  .brand{display:none}
  .events div+div{display:none}
  .md{padding:16px}
  .md h2{font-size:22px}
  .deed{width:100%}
}
@media (prefers-reduced-motion:reduce){.tok{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="board" aria-label="Game board"></div>
  <aside id="side">
    <div class="bar">
      <button class="btn sm" id="b-new">New game</button>
      <button class="btn sm" id="b-speed">Speed: normal</button>
      <button class="btn sm" id="b-rules">How to play</button>
      <button class="btn sm" id="b-finish">Finish now</button>
    </div>
    <div class="players" id="players"></div>
    <div class="log" id="log" aria-live="polite"></div>
  </aside>
</div>
<div id="modals"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   DATA
   ===================================================================== */
const GROUPS = {
  brown:  {name:'Brown',      color:'#8b5a3c', ink:'#fff'},
  sky:    {name:'Light blue', color:'#93d2ef', ink:'#1b2430'},
  pink:   {name:'Pink',       color:'#d6458e', ink:'#fff'},
  orange: {name:'Orange',     color:'#f08a24', ink:'#1b2430'},
  red:    {name:'Red',        color:'#dc3a2f', ink:'#fff'},
  yellow: {name:'Yellow',     color:'#f3d22a', ink:'#1b2430'},
  green:  {name:'Green',      color:'#2c9a58', ink:'#fff'},
  navy:   {name:'Dark blue',  color:'#2a4ea6', ink:'#fff'},
};
const GROUP_ORDER = Object.keys(GROUPS);
const RAIL_COLOR = '#3b4656', UTIL_COLOR = '#8796a3';

function netWorth(pi) {
  const p = P(pi); let v = p.money;
  for (const i of BUYABLE) {
    const o = own(i); if (o.o !== pi) continue;
    const sp = SPACES[i];
    v += o.m ? sp.price / 2 : sp.price;
    if (o.h) v += o.h * sp.hc;
  }
  return v;
}
function liquidValue(pi) {
  let v = P(pi).money;
  for (const i of BUYABLE) {
    const o = own(i); if (o.o !== pi) continue;
    const sp = SPACES[i];
    if (o.h) v += o.h * Math.floor(sp.hc / 2);
    if (!o.m) v += sp.price / 2;
  }
  return v;
}

function gridPos(i) {
  if (i === 0) return [11, 11, 'corner'];
  if (i < 10) return [11, 11 - i, 'b'];
  if (i === 10) return [11, 1, 'corner'];
  if (i < 20) return [21 - i, 1, 'l'];
  if (i === 20) return [1, 1, 'corner'];
  if (i < 30) return [1, i - 19, 't'];
  if (i === 30) return [1, 11, 'corner'];
  return [i - 29, 11, 'r'];
}
function spaceCenter(i) {
  if (i === 0) return [11.4, 11.4];
  if (i < 10) return [11.1 - i, 11.4];
  if (i === 10) return [0.8, 11.4];
  if (i < 20) return [0.8, 21.1 - i];
  if (i === 20) return [0.8, 0.8];
  if (i < 30) return [i - 18.9, 0.8];
  if (i === 30) return [11.4, 0.8];
  return [11.4, i - 28.9];
}

function skylineSVG() {
  const hs = [38,62,45,80,55,30,70,92,48,66,40,74,58,35,84,50,64,42,76,52,60,36,88,46];
  let x = 0, r = '';
  hs.forEach((h, k) => {
    const w = 14 + (k * 7 % 9);
    r += `<rect x="${x}" y="${100 - h}" width="${w}" height="${h}"/>`;
    if (k % 4 === 1) r += `<rect x="${x + w / 2 - 1}" y="${100 - h - 9}" width="2" height="9"/>`;
    x += w + 2;
  });
  return `<svg class="skyline" viewBox="0 0 ${x} 100" preserveAspectRatio="none" aria-hidden="true"><g fill="currentColor">${r}</g></svg>`;
}

const tokenEls = [];
function tokenXY(pi) {
  const p = P(pi), i = p.pos;
  const same = active().filter(q => P(q).pos === i && (i !== 10 || P(q).jail === p.jail));
  const k = Math.max(0, same.indexOf(pi)), n = same.length;
  const offs = [[-1,-1],[1,-1],[-1,1],[1,1]];
  if (i === 10) {
    if (p.jail) { const d = offs[k % 4]; return n === 1 ? [1.06, 11.14] : [1.06 + d[0] * .24, 11.14 + d[1] * .24]; }
    return [[0.26, 10.98], [0.26, 11.6], [0.82, 11.94], [1.36, 11.94]][k % 4];
  }
  const [cx, cy] = spaceCenter(i);
  const side = gridPos(i)[2];
  const out = {b:[0,1], t:[0,-1], l:[-1,0], r:[1,0], corner:[0,0]}[side];
  const s = side === 'corner' ? .32 : .22;
  const bx = cx + out[0] * .2, by = cy + out[1] * .2;
  if (n === 1) return [bx, by];
  const d = offs[k % 4];
  return [bx + d[0] * s, by + d[1] * s];
}
function renderTokens() {
  const layer = $('#tokens'); if (!layer) return;
  $('#board').style.setProperty('--tt', Math.max(40, spd().step) + 'ms');
  G.players.forEach((p, pi) => {

    el.textContent = p.token;
    el.style.display = p.out ? 'none' : '';

    el.style.top = (y / 12.2 * 100) + '%';
    el.classList.toggle('cur', pi === G.turn && !G.over && !G.preview);
  });
}

function chip(j, pi, c) {
  const o = own(j), mine = o.o === pi;
  const title = SPACES[j].name + (mine && o.h ? `, ${housesText(o.h)}` : '') + (mine && o.m ? ', mortgaged' : '') + (!mine ? (o.o >= 0 ? `, owned by ${P(o.o).name}` : ', unowned') : '');
  return `<button class="chip ${mine ? 'mine' : 'not'}${mine && o.m ? ' m' : ''}" style="--gc:${c}" data-deed="${j}" title="${esc(title)}" aria-label="${esc(title)}">${mine && o.h ? (o.h === 5 ? 'H' : o.h) : ''}</button>`;
}
function chipsFor(pi) {
  const parts = [];
  for (const g of GROUP_ORDER) {
    const grp = GROUP_IDX[g];
    if (grp.some(j => own(j).o === pi)) parts.push(`<span class="grp">${grp.map(j => chip(j, pi, GROUPS[g].color)).join('')}</span>`);
  }
  if (RAILS.some(j => own(j).o === pi)) parts.push(`<span class="grp">${RAILS.map(j => chip(j, pi, RAIL_COLOR)).join('')}</span>`);
  if (UTILS.some(j => own(j).o === pi)) parts.push(`<span class="grp">${UTILS.map(j => chip(j, pi, UTIL_COLOR)).join('')}</span>`);
  return parts.join('');
}

/* =====================================================================
   MODALS
   ===================================================================== */
const modals = [];
function openModal(o) {
  const ov = document.createElement('div'); ov.className = 'ov';
  const md = document.createElement('div'); md.className = 'md ' + (o.cls || '');
  md.setAttribute('role', 'dialog'); md.setAttribute('aria-modal', 'true');
  ov.appendChild(md); $('#modals').appendChild(ov);
  const m = {ov, md, live:!!o.live, closable:!!o.closable,
    refresh() {
      const a = document.activeElement;
      const key = a && md.contains(a) ? a.dataset.focus : null;
      const st = md.scrollTop;
      md.innerHTML = o.draw();
      md.scrollTop = st;
      if (key) { const el = md.querySelector(`[data-focus="${key}"]`); if (el) el.focus({preventScroll:true}); }
    },
    close() {
      if (!ov.isConnected) return;
      ov.remove();
      const k = modals.indexOf(m); if (k >= 0) modals.splice(k, 1);
      if (o.onClose) o.onClose();
      render();
    }};
  md.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled || !md.contains(b)) return;
    if (o.on) o.on(b.dataset.act, b.dataset, b);
  });
  if (o.onInput) md.addEventListener('input', e => o.onInput(e.target));
  if (o.onChange) md.addEventListener('change', e => o.onChange(e.target));
  if (m.closable) ov.addEventListener('mousedown', e => { if (e.target === ov) m.close(); });
  m.escapeFn = o.escape || null;
  modals.push(m);
  m.refresh();
  setTimeout(() => {
    if (!ov.isConnected) return;
    const f = md.querySelector('[autofocus]') || md.querySelector('.btn.primary:not(:disabled)') || md.querySelector('.btn:not(:disabled)');
    if (f) f.focus({preventScroll:true});
  }, 0);
  return m;
}
function closeAllModals() { while (modals.length) modals.pop().ov.remove(); }

function infoBox(title, html, ok = 'OK', cls = '') {
  return new Promise(res => {
    const m = openModal({cls, draw:() => `<h2>${title}</h2>${html}<div class="row"><button class="btn primary" data-act="ok">${ok}</button></div>`,
      on:() => { m.close(); res(); }, escape:() => { m.close(); res(); }});

}
function confirmBox(title, html, yes, danger) {
  return new Promise(res => {
    const m = openModal({draw:() => `<h2>${title}</h2>${html}<div class="row"><button class="btn" data-act="no">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-act="yes">${yes}</button></div>`,

/* =====================================================================
   PROPERTY MANAGEMENT
   ===================================================================== */
function buildBlock(pi, i) {
  const sp = SPACES[i], o = own(i);
  if (sp.t !== 'prop') return 'Only streets can have houses.';
  if (o.o !== pi) return 'You do not own this.';
  const grp = GROUP_IDX[sp.g];
  if (!grp.every(j => own(j).o === pi)) return 'You need the whole colour set first.';
  if (grp.some(j => own(j).m)) return 'Pay off the mortgages in this set first.';
  if (o.h >= 5) return 'This street already has a hotel.';
  if (o.h > Math.min(...grp.map(j => own(j).h))) return 'Build evenly: add to the other streets in this set first.';
  if (o.h === 4 ? G.hotels < 1 : G.houses < 1) return o.h === 4 ? 'The bank has no hotels left.' : 'The bank has no houses left.';
  if (P(pi).money < sp.hc) return `You need ${money(sp.hc)}.`;
  return '';
}
function sellBlock(pi, i) {
  const sp = SPACES[i], o = own(i);
  if (sp.t !== 'prop' || o.o !== pi || o.h === 0) return 'No buildings to sell.';
  if (o.h < Math.max(...GROUP_IDX[sp.g].map(j => own(j).h))) return 'Sell evenly: sell from the other streets in this set first.';
  return '';
}
function mortBlock(pi, i) {
  const sp = SPACES[i], o = own(i);
  if (o.o !== pi) return 'You do not own this.';
  if (o.m) return 'Already mortgaged.';
  if (sp.t === 'prop' && GROUP_IDX[sp.g].some(j => own(j).h > 0)) return 'Sell the buildings in this colour set first.';
  return '';
}
function unmortBlock(pi, i) {
  const o = own(i);
  if (o.o !== pi) return 'You do not own this.';
  if (!o.m) return 'Not mortgaged.';
  if (P(pi).money < unmortCost(i)) return `You need ${money(unmortCost(i))}.`;
  return '';
}
function afterManage() { render(); if (UI.safe) save(); }
function build(pi, i) {
  if (buildBlock(pi, i)) return false;
  const sp = SPACES[i], o = own(i);
  P(pi).money -= sp.hc;
  if (o.h === 4) { G.houses += 4; G.hotels--; o.h = 5; } else { G.houses--; o.h++; }
  log(`${pn(pi)} builds ${o.h === 5 ? 'a hotel' : 'a house'} on ${esc(sp.name)}.`);
  afterManage(); return true;
}
function sellHouse(pi, i) {
  if (sellBlock(pi, i)) return false;
  const sp = SPACES[i], o = own(i), half = Math.floor(sp.hc / 2);
  let refund;
  if (o.h === 5) {
    const keep = Math.min(4, G.houses);
    G.hotels++; G.houses -= keep; refund = half * (5 - keep); o.h = keep;
    log(`${pn(pi)} sells the hotel on ${esc(sp.name)} for ${money(refund)}.`);
  } else {
    o.h--; G.houses++; refund = half;
    log(`${pn(pi)} sells a house on ${esc(sp.name)} for ${money(refund)}.`);
  }
  P(pi).money += refund;
  afterManage(); return true;
}
function mortgage(pi, i) {
  if (mortBlock(pi, i)) return false;
  own(i).m = true;
  P(pi).money += SPACES[i].price / 2;
  log(`${pn(pi)} mortgages ${esc(SPACES[i].name)} for ${money(SPACES[i].price / 2)}.`);
  afterManage(); return true;
}
function unmortgage(pi, i) {
  if (unmortBlock(pi, i)) return false;
  own(i).m = false;
  P(pi).money -= unmortCost(i);
  log(`${pn(pi)} pays off the mortgage on ${esc(SPACES[i].name)} (${money(unmortCost(i))}).`);
  afterManage(); return true;
}
function tradable(pi, i) {
  const sp = SPACES[i], o = own(i);
  if (o.o !== pi) return false;
  return sp.t !== 'prop' || GROUP_IDX[sp.g].every(j => own(j).h === 0);
}
function manageAct(act, i, pi) {
  if (UI.manager !== pi || P(pi).cpu) return;
  if (act === 'build') build(pi, i);
  else if (act === 'sell') sellHouse(pi, i);
  else if (act === 'mort') mortgage(pi, i);
  else if (act === 'unmort') unmortgage(pi, i);
}
function manageButtons(pi, i) {
  const sp = SPACES[i], o = own(i), b = [];
  const btn = (act, label, why) => `<button class="btn sm" data-act="${act}" data-i="${i}" data-focus="${act}-${i}"${why ? ` disabled title="${esc(why)}"` : ''}>${label}</button>`;

}

/* =====================================================================
   RENT, MONEY, BANKRUPTCY
   ===================================================================== */
function rentFor(i, roll, opts = {}) {
  const sp = SPACES[i], o = own(i);
  if (o.o < 0 || o.m) return 0;
  if (sp.t === 'prop') {
    if (o.h > 0) return sp.rent[o.h];
    return sp.rent[0] * (ownsGroup(o.o, sp.g) ? 2 : 1);
  }
  if (sp.t === 'rail') {
    const n = RAILS.filter(j => own(j).o === o.o).length;
    return 25 * Math.pow(2, n - 1) * (opts.railMult || 1);
  }
  const n = UTILS.filter(j => own(j).o === o.o).length;
  return (opts.util10 || n === 2 ? 10 : 4) * roll;
}

async function charge(pi, amt, to, why) {
  const p = P(pi);
  amt = Math.round(amt);
  if (amt <= 0) return true;
  if (p.money < amt) {
    const ok = p.cpu ? cpuRaise(pi, amt) : await humanRaise(pi, amt, to, why);
    if (!ok || p.money < amt) { await bankrupt(pi, to); return false; }
  }
  p.money -= amt;
  if (to >= 0) P(to).money += amt;
  else if (G.rules.parking) G.pot += amt;
  render();
  return true;
}

async function humanRaise(pi, amt, to, why) {
  const p = P(pi);
  log(`${pn(pi)} needs ${money(amt)} for ${esc(why)} but has only ${money(p.money)}.`);
  while (true) {
    const c = await ask(pi, {manage:true, trade:true,
      prompt:() => p.money >= amt
        ? `You now have enough to pay ${money(amt)} for ${esc(why)}.`
        : `You owe ${money(amt)} ${to >= 0 ? 'to ' + esc(P(to).name) : 'to the bank'} for ${esc(why)}, and you have ${money(p.money)}. Raise ${money(amt - p.money)} by selling houses, mortgaging or trading. Selling everything would give you ${money(liquidValue(pi))}.`,
      buttons:() => [{id:'pay', label:`Pay ${money(amt)}`, primary:true, disabled:p.money < amt}, {id:'bankrupt', label:'Declare bankruptcy', danger:true}]});
    if (c === 'pay') return true;
    const sure = await confirmBox('Declare bankruptcy?',
      `<p>${esc(p.name)} leaves the game. ${to >= 0 ? `Everything ${esc(p.name)} owns goes to ${esc(P(to).name)}.` : 'All of their property goes back to the bank.'}</p>`, 'Declare bankruptcy', true);
    if (sure) return false;
  }
}

async function bankrupt(pi, to) {
  const p = P(pi);
  for (const i of BUYABLE) {
    const o = own(i);
    if (o.o !== pi || !o.h) continue;
    p.money += Math.floor(SPACES[i].hc / 2) * o.h;
    if (o.h === 5) G.hotels++; else G.houses += o.h;
    o.h = 0;
  }
  if (to >= 0) {
    const c = P(to);
    c.money += p.money;
    for (const i of BUYABLE) if (own(i).o === pi) own(i).o = to;
    c.cards.push(...p.cards);
    log(`${pn(pi)} is bankrupt. ${pn(to)} takes everything they had left.`);
  } else {
    for (const i of BUYABLE) { const o = own(i); if (o.o === pi) { o.o = -1; o.m = false; } }
    p.cards.forEach(d => G.decks[d].push(JAIL_CARD[d]));
    log(`${pn(pi)} is bankrupt. Their property goes back to the bank.`);
  }
  p.cards = []; p.money = 0; p.out = true; p.jail = false; p.jailTurns = 0;
  const left = active();
  if (left.length === 1) { G.over = true; G.winner = left[0]; }
  render();
  if (!p.cpu && !G.over) await infoBox('Bankrupt', `<p>${badge(pi)} is out of the game.</p>`, 'Continue');
}

/* =====================================================================
   DICE AND MOVEMENT
   ===================================================================== */
async function doRoll(pi, purpose) {
  let a = rnd6(), b = rnd6();
  if (TEST.dice.length) [a, b] = TEST.dice.shift();
  const frames = spd().roll;
  diceRolling = true;
  for (let k = 0; k < frames; k++) { G.dice = [rnd6(), rnd6()]; renderDice(); await sleep(55); }
  diceRolling = false;
  G.dice = [a, b];
  log(`${pn(pi)} rolls ${a} and ${b}${purpose ? ' ' + purpose : ''}${a === b && !purpose ? ', doubles' : ''}.`);
  render();
  await sleep(spd().step * 2);
  return [a, b];
}
async function moveSteps(pi, n, fast) {
  const p = P(pi);
  const step = fast ? Math.round(spd().step * .45) : spd().step;
  for (let k = 0; k < n; k++) {
    p.pos = (p.pos + 1) % 40;
    if (p.pos === 0) { p.money += GO_SALARY; log(`${pn(pi)} passes Start and collects ${money(GO_SALARY)}.`); renderPlayers(); }
    renderTokens();
    if (step) await sleep(step);
  }
  UI.landed = p.pos;
  render();
}
async function moveTo(pi, target) { await moveSteps(pi, (target - P(pi).pos + 40) % 40, true); }
async function moveBack(pi, n) {
  const p = P(pi);
  for (let k = 0; k < n; k++) { p.pos = (p.pos + 39) % 40; renderTokens(); if (spd().step) await sleep(spd().step); }
  UI.landed = p.pos;
  render();
}
async function goToJail(pi) {
  const p = P(pi);
  p.pos = 10; p.jail = true; p.jailTurns = 0;
  G.doubles = 0; G.extraRoll = false;
  UI.landed = 10;
  log(`${pn(pi)} goes to jail.`);
  render();
  await sleep(spd().step * 3);
}
function payJailFine(pi) {
  const p = P(pi);
  if (p.money < JAIL_FINE) return;
  p.money -= JAIL_FINE;
  if (G.rules.parking) G.pot += JAIL_FINE;
  p.jail = false; p.jailTurns = 0;
  log(`${pn(pi)} pays ${money(JAIL_FINE)} to get out of jail.`);
  render();
}
function useJailCard(pi) {
  const p = P(pi);
  if (!p.cards.length) return;
  const d = p.cards.shift();
  G.decks[d].push(JAIL_CARD[d]);
  p.jail = false; p.jailTurns = 0;
  log(`${pn(pi)} uses a get-out-of-jail card.`);
  render();
}

/* =====================================================================
   LANDING
   ===================================================================== */
async function land(pi, roll, opts = {}) {
  const p = P(pi), i = p.pos, sp = SPACES[i];
  switch (sp.t) {
    case 'prop': case 'rail': case 'util':
      await landBuyable(pi, i, roll, opts); break;
    case 'tax':
      if (await charge(pi, sp.amount, -1, sp.name)) { log(`${pn(pi)} pays ${money(sp.amount)} ${esc(sp.name)}.`); render(); }
      break;
    case 'chance': case 'chest':
      await drawCard(pi, sp.t, roll); break;
    case 'gotojail':
      await goToJail(pi); break;
    case 'parking':
      if (G.rules.parking && G.pot > 0) {
        log(`${pn(pi)} collects the Free Parking jackpot of ${money(G.pot)}.`);
        p.money += G.pot; G.pot = 0; render();
      }
      break;
  }
}
async function landBuyable(pi, i, roll, opts) {
  const o = own(i), sp = SPACES[i];
  if (o.o < 0) { await offerBuy(pi, i); return; }
  if (o.o === pi) return;
  if (o.m) { log(`${esc(sp.name)} is mortgaged, so ${pn(pi)} pays no rent.`); render(); return; }
  let rent;
  if (sp.t === 'util' && opts.util10) { const [a, b] = await doRoll(pi, 'for the utility'); rent = 10 * (a + b); }
  else rent = rentFor(i, roll, opts);
  if (await charge(pi, rent, o.o, `rent on ${sp.name}`)) {
    log(`${pn(pi)} pays ${pn(o.o)} ${money(rent)} rent for ${esc(sp.name)}.`);
    render();
  }
  await sleep(spd().cpu * .4);
}
async function offerBuy(pi, i) {
  const p = P(pi), sp = SPACES[i];
  let buy;
  if (p.cpu) { await sleep(spd().cpu * .6); buy = cpuWantsBuy(pi, i); }
  else buy = await buyModal(pi, i);
  if (buy && p.money >= sp.price) {
    p.money -= sp.price;
    own(i).o = pi;
    log(`${pn(pi)} buys ${esc(sp.name)} for ${money(sp.price)}.`);
    render();
  } else {
    await auction(i);
  }
}
function buyModal(pi, i) {
  const p = P(pi), sp = SPACES[i];
  UI.manager = pi;
  return new Promise(res => {
    const m = openModal({live:true, draw:() => `<h2>${esc(sp.name)} is for sale</h2>
      <div class="deedwrap">${deedHTML(i)}<div class="deedside">
        <p>${badge(pi)} has ${money(p.money)}.</p>
        <p>${p.money >= sp.price ? `Buy it for ${money(sp.price)}, or let everyone bid for it at auction.` : `You need ${money(sp.price - p.money)} more to buy it. Mortgage or sell something first, or send it to auction.`}</p>
      </div></div>
      <div class="row split"><button class="btn" data-act="manage">Raise money</button>
      <span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="auction">Auction it</button><button class="btn primary" data-act="buy"${p.money < sp.price ? ' disabled' : ''}>Buy for ${money(sp.price)}</button></span></div>`,
      on:act => {
        if (act === 'manage') { openManage(pi); return; }
        UI.manager = null;
        m.close();
        res(act === 'buy');
      }});
  });
}

async function drawCard(pi, deck, roll) {
  const p = P(pi), D = DECKS[deck];
  const idx = G.decks[deck].shift();
  const card = D.cards[idx];
  if (card.a === 'goojf') p.cards.push(deck); else G.decks[deck].push(idx);
  log(`${pn(pi)} draws ${D.name}: “${esc(card.text)}”`);
  render();
  if (p.cpu) await sleep(spd().cpu * 1.6);
  else await infoBox(D.name, `<div class="cardv ${D.cls}"><div class="ci">${D.icon}</div><div class="cn">${D.name} card for ${esc(p.name)}</div><div class="ct">${esc(card.text)}</div></div>`, 'OK');
  switch (card.a) {
    case 'move':
      await moveTo(pi, card.to);
      await land(pi, roll);
      break;
    case 'nearest': {
      const list = card.kind === 'rail' ? RAILS : UTILS;
      let t = p.pos; do { t = (t + 1) % 40; } while (!list.includes(t));
      await moveTo(pi, t);
      await landBuyable(pi, t, roll, card.kind === 'rail' ? {railMult:2} : {util10:true});
      break;
    }
    case 'gain':
      p.money += card.amt; log(`${pn(pi)} collects ${money(card.amt)}.`); render(); break;
    case 'pay':
      if (await charge(pi, card.amt, -1, `the ${D.name} card`)) { log(`${pn(pi)} pays ${money(card.amt)}.`); render(); }
      break;
    case 'goojf':
      render(); break;
    case 'back':
      await moveBack(pi, card.n);
      await land(pi, roll);
      break;
    case 'jail':
      await goToJail(pi); break;
    case 'repairs': {
      let houses = 0, hotels = 0;
      for (const i of BUYABLE) { const o = own(i); if (o.o === pi) { if (o.h === 5) hotels++; else houses += o.h; } }
      const cost = houses * card.h + hotels * card.H;
      if (!cost) { log(`${pn(pi)} has no buildings, so there is nothing to pay.`); render(); break; }
      if (await charge(pi, cost, -1, 'repairs')) { log(`${pn(pi)} pays ${money(cost)} for repairs.`); render(); }
      break;
    }
    case 'payeach':
      for (const q of active()) {
        if (q === pi) continue;
        if (!await charge(pi, card.amt, q, `the ${D.name} card`)) break;
        log(`${pn(pi)} pays ${pn(q)} ${money(card.amt)}.`);
      }
      render(); break;
    case 'collecteach':
      for (const q of active()) {
        if (q === pi || P(pi).out) continue;
        if (await charge(q, card.amt, pi, `${P(pi).name}'s birthday`)) log(`${pn(q)} pays ${pn(pi)} ${money(card.amt)}.`);
      }
      render(); break;
  }
}

/* =====================================================================
   AUCTIONS
   ===================================================================== */
async function auction(i) {
  const sp = SPACES[i], n = G.players.length;
  const order = [];
  for (let k = 0; k < n; k++) { const q = (G.turn + k) % n; if (!P(q).out) order.push(q); }
  const A = {i, high:0, by:-1, active:order.slice(), all:order.slice(), cur:-1, note:'', done:false, resolve:null, err:''};
  log(`${esc(sp.name)} goes up for auction.`);
  render();
  const m = openModal({cls:'wide', draw:() => auctionHTML(A), on:(act, d) => {
    if (act === 'continue' && A.done && A.resolveDone) { A.resolveDone(); return; }
    if (!A.resolve) return;
    const p = P(A.cur);
    let v = null;
    if (act === 'drop') { A.resolve(null); return; }
    if (act === 'bid') v = +d.v;
    if (act === 'custom') { const inp = m.md.querySelector('#bidin'); v = Math.floor(+(inp && inp.value)); }
    if (!Number.isFinite(v) || v <= A.high) { A.err = `Bid more than ${money(A.high)}.`; m.refresh(); return; }
    if (v > p.money) { A.err = `You only have ${money(p.money)}.`; m.refresh(); return; }
    A.err = '';
    A.resolve(v);
  }});
  let k = 0;
  while (true) {
    if (!A.active.some(x => x !== A.by)) break;
    const pos = k % A.active.length, q = A.active[pos];
    if (q === A.by) { k = pos + 1; continue; }
    if (P(q).money < A.high + 1 || (A.high === 0 && P(q).money < 10)) {
      A.note = `${esc(P(q).name)} can't top the bid and drops out.`;
      A.active.splice(pos, 1); k = pos; m.refresh(); continue;
    }
    A.cur = q; A.err = '';
    m.refresh();
    let bid;
    if (P(q).cpu) { await sleep(spd().cpu * .7); bid = cpuBid(q, A); }
    else { bid = await new Promise(res => { A.resolve = res; m.refresh(); }); A.resolve = null; }
    if (bid == null) { A.note = `${esc(P(q).name)} drops out.`; A.active.splice(pos, 1); k = pos; }
    else { A.high = bid; A.by = q; A.note = `${esc(P(q).name)} bids ${money(bid)}.`; k = pos + 1; }
    m.refresh();
  }
  A.cur = -1;
  if (A.by >= 0) {
    P(A.by).money -= A.high;
    own(i).o = A.by;
    log(`${pn(A.by)} wins ${esc(sp.name)} at auction for ${money(A.high)}.`);
    A.note = `${esc(P(A.by).name)} wins ${esc(sp.name)} for ${money(A.high)}.`;
  } else {
    log(`Nobody bids, so ${esc(sp.name)} stays with the bank.`);
    A.note = `Nobody bid. ${esc(sp.name)} stays with the bank.`;
  }
  A.done = true;
  render();
  const humans = A.all.some(q => !P(q).cpu);
  if (humans) await new Promise(res => { A.resolveDone = res; m.refresh(); });
  else { m.refresh(); await sleep(spd().cpu * 1.2); }
  m.close();
}
function auctionHTML(A) {
  const sp = SPACES[A.i];
  const bidders = A.all.map(q => `<span class="${A.active.includes(q) ? '' : 'gone'}">${badge(q)}${A.by === q ? ' (highest)' : ''}</span>`).join('');
  let box = '';
  if (A.done) box = `<p class="ok">${A.note}</p><div class="row"><button class="btn primary" data-act="continue">Continue</button></div>`;
  else if (A.cur >= 0) {
    const p = P(A.cur);
    if (p.cpu) box = `<p>${badge(A.cur)} is deciding…</p>`;
    else {
      const min = A.high + 1;
      const steps = [10, 50, 100].map(s => A.high + s);
      box = `<p>${badge(A.cur)}, it's your bid. You have ${money(p.money)}.</p>
        <div class="bidrow">${steps.map(v => `<button class="btn${v === steps[0] ? ' primary' : ''}" data-act="bid" data-v="${v}"${v > p.money ? ' disabled' : ''}>Bid ${money(v)}</button>`).join('')}</div>
        <div class="bidrow"><input id="bidin" type="number" inputmode="numeric" min="${min}" max="${p.money}" step="1" placeholder="Amount" aria-label="Your bid"><button class="btn" data-act="custom">Bid this amount</button><button class="btn danger" data-act="drop">Drop out</button></div>
        ${A.err ? `<p class="err" style="margin-top:8px">${A.err}</p>` : ''}`;
    }
  }
  return `<h2>Auction: ${esc(sp.name)}</h2>
    <div class="deedwrap">${deedHTML(A.i)}<div class="deedside">
      <div class="auc-st"><span class="muted">Highest bid</span><span class="auc-high">${A.by >= 0 ? money(A.high) : 'No bids yet'}</span>${A.by >= 0 ? `<span>by ${badge(A.by)}</span>` : ''}</div>
      <div class="bidders">${bidders}</div>
      ${A.note && !A.done ? `<p class="muted">${A.note}</p>` : ''}
      <div class="bidbox">${box}</div>
    </div></div>`;
}

/* =====================================================================
   TRADING
   ===================================================================== */
function feesFor(st) {
  const fee = list => list.reduce((s, i) => s + (own(i).m ? mortFee(i) : 0), 0);
  return {a:fee(st.get.props), b:fee(st.give.props)};
}
function countCards(list, d) { return list.filter(x => x === d).length; }
function tradeValid(st) {
  const A = P(st.a), B = P(st.b);
  if (A.out || B.out) return {ok:false, msg:'That player is out of the game.'};
  const g = st.give, t = st.get;
  if (!g.props.length && !t.props.length && !g.cash && !t.cash && !g.cards.length && !t.cards.length) return {ok:false, msg:'Pick something to trade.'};
  for (const i of g.props) if (!tradable(st.a, i)) return {ok:false, msg:`${SPACES[i].name} can't be traded while its colour set has buildings.`};
  for (const i of t.props) if (!tradable(st.b, i)) return {ok:false, msg:`${SPACES[i].name} can't be traded while its colour set has buildings.`};
  if (g.cash < 0 || t.cash < 0 || !Number.isInteger(g.cash) || !Number.isInteger(t.cash)) return {ok:false, msg:'Cash amounts must be whole numbers.'};
  if (g.cash > A.money) return {ok:false, msg:`${A.name} only has ${money(A.money)}.`};
  if (t.cash > B.money) return {ok:false, msg:`${B.name} only has ${money(B.money)}.`};
  for (const d of ['chance','chest']) {
    if (countCards(g.cards, d) > countCards(A.cards, d)) return {ok:false, msg:'Card mismatch.'};
    if (countCards(t.cards, d) > countCards(B.cards, d)) return {ok:false, msg:'Card mismatch.'};
  }
  const f = feesFor(st);
  if (A.money - g.cash + t.cash - f.a < 0) return {ok:false, msg:`${A.name} can't cover the 10% fee on mortgaged property (${money(f.a)}).`};
  if (B.money - t.cash + g.cash - f.b < 0) return {ok:false, msg:`${B.name} can't cover the 10% fee on mortgaged property (${money(f.b)}).`};
  return {ok:true};
}
function sideText(side, plain) {
  const parts = side.props.map(i => plain ? SPACES[i].name : `${sw(i)}${esc(SPACES[i].name)}${own(i).m ? ' (mortgaged)' : ''}`);
  if (side.cash) parts.push(money(side.cash));
  side.cards.forEach(() => parts.push('a get-out-of-jail card'));
  return parts.length ? parts.join(', ') : 'nothing';
}
function tradeSummary(st) {
  const f = feesFor(st);
  return `<div class="tr-sum"><p>${badge(st.a)} gives ${sideText(st.give)}</p><p>${badge(st.b)} gives ${sideText(st.get)}</p>
    ${f.a || f.b ? `<p class="muted">Mortgaged property carries a 10% fee for whoever receives it${f.a ? `: ${esc(P(st.a).name)} pays ${money(f.a)}` : ''}${f.a && f.b ? ',' : ''}${f.b ? ` ${esc(P(st.b).name)} pays ${money(f.b)}` : ''}.</p>` : ''}</div>`;
}
function applyTrade(st) {
  const A = P(st.a), B = P(st.b), f = feesFor(st);
  A.money += st.get.cash - st.give.cash - f.a;
  B.money += st.give.cash - st.get.cash - f.b;
  st.give.props.forEach(i => own(i).o = st.b);
  st.get.props.forEach(i => own(i).o = st.a);
  st.give.cards.forEach(d => { A.cards.splice(A.cards.indexOf(d), 1); B.cards.push(d); });
  st.get.cards.forEach(d => { B.cards.splice(B.cards.indexOf(d), 1); A.cards.push(d); });
  log(`Trade: ${pn(st.a)} gives ${esc(sideText(st.give, true))}; ${pn(st.b)} gives ${esc(sideText(st.get, true))}.`);
  afterManage();
}
function openTrade(a) {
  const others = active().filter(x => x !== a);
  if (!others.length) return;
  const blank = () => ({props:[], cash:0, cards:[]});
  const st = {a, b:others[0], give:blank(), get:blank(), stage:'edit', msg:'', msgCls:'err'};
  const colHTML = (pi, side, key) => {
    const p = P(pi);
    const props = BUYABLE.filter(i => own(i).o === pi);
    const items = props.map(i => {
      const ok = tradable(pi, i);
      return `<label class="tr-item${ok ? '' : ' dis'}"${ok ? '' : ' title="Sell the buildings in this colour set first"'}><input type="checkbox" data-side="${key}" data-i="${i}"${side.props.includes(i) ? ' checked' : ''}${ok ? '' : ' disabled'}>${sw(i)}${esc(SPACES[i].name)}${own(i).m ? ' <span class="muted">(mortgaged)</span>' : ''}${own(i).h ? ` <span class="muted">(${housesText(own(i).h)})</span>` : ''}</label>`;
    }).join('');
    const cards = p.cards.map((d, k) => `<label class="tr-item"><input type="checkbox" data-card="${key}" data-k="${k}"${st[key + 'CardSel'] && st[key + 'CardSel'].includes(k) ? ' checked' : ''}>Get-out-of-jail card</label>`).join('');
    return `<div class="tr-col"><h3>${badge(pi)} <span class="muted" style="font-weight:400">gives</span></h3>
      ${items || '<p class="muted">No property.</p>'}${cards}
      <div class="tr-cash"><label for="cash-${key}">Cash</label><input id="cash-${key}" data-focus="cash-${key}" type="number" inputmode="numeric" min="0" max="${p.money}" step="10" value="${side.cash || ''}" placeholder="0" data-cash="${key}"><span class="muted">of ${money(p.money)}</span></div></div>`;
  };
  const draw = () => {
    if (st.stage === 'confirm') {
      return `<h2>Trade offer for ${esc(P(st.b).name)}</h2><p>Pass the device to ${badge(st.b)}. Do you accept this trade?</p>${tradeSummary(st)}
        <div class="row"><button class="btn" data-act="decline">Decline</button><button class="btn primary" data-act="accept">Accept</button></div>`;
    }
    if (st.stage === 'done') {
      return `<h2>Trade</h2><p class="${st.msgCls}">${st.msg}</p>${tradeSummary(st)}<div class="row"><button class="btn primary" data-act="close">Done</button></div>`;
    }
    const opts = others.map(q => `<option value="${q}"${q === st.b ? ' selected' : ''}>${esc(P(q).name)}${P(q).cpu ? ' (computer)' : ''}</option>`).join('');
    return `<h2>Propose a trade</h2>
      <div class="tr-top"><label for="tr-with">Trade with</label><select id="tr-with" data-partner="1">${opts}</select></div>
      <div class="tr-cols">${colHTML(st.a, st.give, 'give')}${colHTML(st.b, st.get, 'get')}</div>
      ${st.msg ? `<p class="${st.msgCls}" style="margin-top:12px">${st.msg}</p>` : ''}
      <div class="row"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="propose">Propose trade</button></div>`;
  };
  const syncCards = () => {
    st.give.cards = (st.giveCardSel || []).map(k => P(st.a).cards[k]).filter(Boolean);
    st.get.cards = (st.getCardSel || []).map(k => P(st.b).cards[k]).filter(Boolean);
  };
  const m = openModal({cls:'wide', closable:true, draw,
    onChange:t => {
      if (t.dataset.partner) { st.b = +t.value; st.get = blank(); st.getCardSel = []; st.msg = ''; m.refresh(); return; }
      if (t.dataset.side) {
        const side = st[t.dataset.side], i = +t.dataset.i;
        side.props = t.checked ? [...side.props, i] : side.props.filter(x => x !== i);
        st.msg = ''; m.refresh(); return;
      }
      if (t.dataset.card) {
        const key = t.dataset.card + 'CardSel', k = +t.dataset.k;
        st[key] = st[key] || [];
        st[key] = t.checked ? [...st[key], k] : st[key].filter(x => x !== k);
        syncCards();
      }
    },
    onInput:t => { if (t.dataset.cash) { const v = Math.floor(+t.value || 0); st[t.dataset.cash].cash = Math.max(0, v); } },
    on:act => {
      if (act === 'close') { m.close(); return; }
      if (act === 'propose') {
        syncCards();
        const v = tradeValid(st);
        if (!v.ok) { st.msg = esc(v.msg); st.msgCls = 'err'; m.refresh(); return; }
        if (P(st.b).cpu) {
          const net = tradeNet(st.b, st.a, st);
          if (net >= 20) {
            applyTrade(st);
            st.stage = 'done'; st.msg = `${esc(P(st.b).name)} accepts.`; st.msgCls = 'ok';
          } else {
            const need = Math.ceil((20 - net) / 1.5 / 10) * 10;
            st.msg = `${esc(P(st.b).name)} says no.` + (need <= P(st.a).money - st.give.cash ? ` They might agree if you add about ${money(need)} more.` : ' They want a lot more than this.');
            st.msgCls = 'err';
            log(`${pn(st.b)} turns down a trade from ${pn(st.a)}.`); render();
          }
          m.refresh(); return;
        }
        st.stage = 'confirm'; m.refresh(); return;
      }
      if (act === 'accept') {
        const v = tradeValid(st);
        if (!v.ok) { st.stage = 'edit'; st.msg = esc(v.msg); st.msgCls = 'err'; m.refresh(); return; }
        applyTrade(st); st.stage = 'done'; st.msg = `${esc(P(st.b).name)} accepts.`; st.msgCls = 'ok'; m.refresh(); return;
      }
      if (act === 'decline') {
        st.stage = 'edit'; st.msg = `${esc(P(st.b).name)} declined. Hand the device back to ${esc(P(st.a).name)}.`; st.msgCls = 'err';
        log(`${pn(st.b)} turns down a trade from ${pn(st.a)}.`); render();
        m.refresh();
      }
    }});
}
function humanTradeOffer(st) {
  return new Promise(res => {
    const m = openModal({draw:() => `<h2>Trade offer for ${esc(P(st.b).name)}</h2>
      <p>${badge(st.a)} wants to trade. Pass the device to ${badge(st.b)}.</p>${tradeSummary(st)}
      <div class="row"><button class="btn" data-act="no">Decline</button><button class="btn primary" data-act="yes">Accept</button></div>`,
      on:act => { m.close(); res(act === 'yes'); }, escape:() => { m.close(); res(false); }});
  });
}

/* =====================================================================
   COMPUTER PLAYERS
   ===================================================================== */
const F3 = [0, .30, .75, 2.2], F2 = [0, .45, 2.2];
const RAILV = [0, 200, 450, 750, 1100], UTILV = [0, 150, 360];
function portfolio(who, map) {
  let v = 0;
  for (const g of GROUP_ORDER) {
    const grp = GROUP_IDX[g];
    const total = grp.reduce((s, j) => s + SPACES[j].price, 0);
    const c = grp.filter(j => map[j] === who).length;
    v += (grp.length === 2 ? F2 : F3)[c] * total;
  }
  v += RAILV[RAILS.filter(j => map[j] === who).length];
  v += UTILV[UTILS.filter(j => map[j] === who).length];
  for (const i of BUYABLE) if (map[i] === who && own(i).m) v -= SPACES[i].price * .55;
  return v;
}
function tradeNet(who, partner, st) {
  const before = {}; BUYABLE.forEach(i => before[i] = own(i).o);
  const after = {...before};
  st.give.props.forEach(i => after[i] = st.b);
  st.get.props.forEach(i => after[i] = st.a);
  const f = feesFor(st);
  const cash = {
    [st.a]: st.get.cash - st.give.cash - f.a + 50 * (st.get.cards.length - st.give.cards.length),
    [st.b]: st.give.cash - st.get.cash - f.b + 50 * (st.give.cards.length - st.get.cards.length),
  };
  const dW = x => portfolio(x, after) - portfolio(x, before) + (cash[x] || 0);
  return dW(who) - .5 * dW(partner);
}
function cpuReserve(pi) {
  let worst = 0;
  for (const i of BUYABLE) { const o = own(i); if (o.o < 0 || o.o === pi || o.m) continue; worst = Math.max(worst, rentFor(i, 7)); }
  return Math.max(60, Math.min(500, Math.round(worst * .6)));
}
function cpuWantsBuy(pi, i) {
  const p = P(pi), sp = SPACES[i];
  if (p.money < sp.price) return false;
  const left = p.money - sp.price;
  if (sp.t === 'prop') {
    const grp = GROUP_IDX[sp.g];
    if (grp.every(j => j === i || own(j).o === pi)) return true;
    const others = grp.filter(j => j !== i).map(j => own(j).o);

}
function cpuMaxBid(pi, i) {
  const p = P(pi), sp = SPACES[i];
  let v = sp.price;
  if (sp.t === 'prop') {
    const grp = GROUP_IDX[sp.g];
    const others = grp.filter(j => j !== i).map(j => own(j).o);
    if (others.every(o => o === pi)) v *= 1.7;
    else if (others.every(o => o >= 0 && o !== pi && o === others[0])) v *= 1.4;
    else if (others.some(o => o === pi)) v *= 1.2;

}
function cpuBid(pi, A) {
  const max = cpuMaxBid(pi, A.i);
  const base = A.high === 0 ? 0 : A.high;
  if (base + 10 > max) return null;
  const step = Math.max(10, Math.floor((max - base) / 3 / 10) * 10);

}
function cpuJailChoice(pi) {
  const p = P(pi);
  const unowned = BUYABLE.filter(i => own(i).o < 0).length;
  if (unowned < 6 && cpuReserve(pi) >= 150) return 'stay';
  if (p.cards.length) return 'card';
  if (p.money >= JAIL_FINE + 100) return 'pay';

}
function cpuRaise(pi, amt) {
  const p = P(pi);
  const byPrice = (a, b) => SPACES[a].price - SPACES[b].price;
  const step = () => {
    let c = BUYABLE.filter(i => !mortBlock(pi, i) && !(SPACES[i].t === 'prop' && ownsGroup(pi, SPACES[i].g))).sort(byPrice)[0];
    if (c !== undefined) return mortgage(pi, c);
    c = BUYABLE.filter(i => !sellBlock(pi, i)).sort((a, b) => SPACES[a].hc - SPACES[b].hc)[0];
    if (c !== undefined) return sellHouse(pi, c);
    c = BUYABLE.filter(i => !mortBlock(pi, i)).sort(byPrice)[0];

}
function cpuManage(pi) {
  const p = P(pi);
  const res = cpuReserve(pi);
  const fullSets = GROUP_ORDER.filter(g => ownsGroup(pi, g));
  // 1. pay off mortgages inside full colour sets
  for (const g of fullSets) for (const i of GROUP_IDX[g]) if (own(i).m && p.money - unmortCost(i) >= res) unmortgage(pi, i);
  // 2. raise cash from lone properties if that lets us develop a set
  const devSets = fullSets.filter(g => GROUP_IDX[g].every(j => !own(j).m) && GROUP_IDX[g].some(j => own(j).h < 5));
  if (devSets.length) {
    const hc = Math.min(...devSets.map(g => SPACES[GROUP_IDX[g][0]].hc));
    const singles = BUYABLE.filter(i => !mortBlock(pi, i) && !(SPACES[i].t === 'prop' && GROUP_IDX[SPACES[i].g].filter(j => own(j).o === pi).length >= 2)).sort((a, b) => SPACES[a].price - SPACES[b].price);
    const potential = p.money + singles.reduce((s, i) => s + SPACES[i].price / 2, 0);
    if (p.money - hc < res && potential - hc >= res && devSets.some(g => GROUP_IDX[g].some(j => own(j).h < 3))) {

    }
  }
  // 3. build, best value first
  for (let guard = 0; guard < 80; guard++) {
    const cands = BUYABLE.filter(i => SPACES[i].t === 'prop' && !buildBlock(pi, i) && p.money - SPACES[i].hc >= res);
    if (!cands.length) break;
    const score = i => { const sp = SPACES[i], h = own(i).h; return (sp.rent[h + 1] - (h ? sp.rent[h] : sp.rent[0] * 2)) / sp.hc - h * .05; };
    cands.sort((a, b) => score(b) - score(a));
    build(pi, cands[0]);
  }
  // 4. pay off other mortgages when comfortable
  const ms = BUYABLE.filter(i => own(i).o === pi && own(i).m).sort((a, b) => SPACES[a].price - SPACES[b].price);

}
function cpuFindDeal(pi) {
  const p = P(pi), res = cpuReserve(pi);
  let best = null;
  for (const g of GROUP_ORDER) {
    const grp = GROUP_IDX[g];
    if (grp.some(j => own(j).h > 0)) continue;
    if (!grp.some(j => own(j).o === pi)) continue;
    const others = grp.filter(j => own(j).o !== pi);
    if (!others.length || others.some(j => own(j).o < 0)) continue;
    for (const q of [...new Set(others.map(j => own(j).o))]) {
      if (P(q).out) continue;
      const X = others.filter(j => own(j).o === q);
      const key = `${pi}>${q}:${X.join(',')}`;
      if (G.turnNo - (G.memo[key] ?? -999) < (P(q).cpu ? 8 : 14)) continue;
      if (!P(q).cpu && G.turnNo - (G.memo['h' + q] ?? -999) < 6) continue;
      const ys = [null, ...BUYABLE.filter(y => own(y).o === pi && !grp.includes(y) && tradable(pi, y))];
      for (const y of ys) {
        const st = {a:pi, b:q, give:{props:y == null ? [] : [y], cash:0, cards:[]}, get:{props:X, cash:0, cards:[]}};
        const nq0 = tradeNet(q, pi, st), np0 = tradeNet(pi, q, st);
        const C = Math.max(0, Math.ceil((20 - nq0) / 1.5 / 10) * 10);
        if (C > Math.max(0, p.money - Math.min(res, 200))) continue;
        const score = np0 - 1.5 * C;
        if (score < 15) continue;
        st.give.cash = C;
        if (!tradeValid(st).ok) continue;
        if (!best || score > best.score) best = {st, score, key};

}
async function cpuMaybeTrade(pi) {
  if (G.turnNo - (G.memo['t' + pi] ?? -999) < 3) return;
  const best = cpuFindDeal(pi);
  if (!best) return;
  G.memo['t' + pi] = G.turnNo;
  G.memo[best.key] = G.turnNo;
  const st = best.st, q = st.b;
  if (P(q).cpu) {
    if (tradeNet(q, pi, st) >= 20 && tradeValid(st).ok) { applyTrade(st); await sleep(spd().cpu); }
    return;
  }
  G.memo['h' + q] = G.turnNo;
  const yes = await humanTradeOffer(st);
  if (yes && tradeValid(st).ok) applyTrade(st);
  else { log(`${pn(q)} turns down a trade from ${pn(pi)}.`); render(); }
}
async function cpuPre(pi) {
  await cpuMaybeTrade(pi);
  cpuManage(pi);
  render();
}

/* =====================================================================
   TURN FLOW
   ===================================================================== */
async function preRoll(pi) {
  const p = P(pi);
  if (p.cpu) {
    setStatus(`${esc(p.name)} is thinking…`);
    await sleep(spd().cpu);
    await cpuPre(pi);
    if (p.jail) {
      const c = cpuJailChoice(pi);
      if (c === 'card') useJailCard(pi);
      else if (c === 'pay') payJailFine(pi);
      if (p.jail) { setStatus(`${esc(p.name)} tries to roll doubles…`); return 'jailroll'; }
    }
    setStatus(`${esc(p.name)} is rolling…`);
    return 'roll';
  }
  while (true) {
    const c = await ask(pi, {safe:true, manage:true, trade:true,
      prompt:() => p.jail
        ? `You're in jail. This is try ${p.jailTurns + 1} of 3: roll doubles to get out, pay ${money(JAIL_FINE)}, or use a jail card.`
        : (G.doubles > 0 ? 'You rolled doubles, so you roll again.' : 'Your turn. Roll when you are ready.'),
      buttons:() => p.jail
        ? [{id:'jailroll', label:'Roll for doubles', primary:true}, {id:'pay', label:`Pay ${money(JAIL_FINE)}`, disabled:p.money < JAIL_FINE}].concat(p.cards.length ? [{id:'card', label:'Use jail card'}] : [])
        : [{id:'roll', label:'Roll dice', primary:true}]});
    if (c === 'pay') { payJailFine(pi); continue; }
    if (c === 'card') { useJailCard(pi); continue; }
    return c;
  }
}
async function rollPhase(pi, choice) {
  const p = P(pi);
  if (choice === 'jailroll') {
    const [a, b] = await doRoll(pi, 'to try to leave jail');
    if (a === b) {
      p.jail = false; p.jailTurns = 0;
      log(`${pn(pi)} rolled doubles and leaves jail.`);
      await moveSteps(pi, a + b);
      await land(pi, a + b);
      return false;
    }
    p.jailTurns++;
    if (p.jailTurns >= 3) {
      log(`${pn(pi)} failed three times and must pay ${money(JAIL_FINE)}.`);
      if (!await charge(pi, JAIL_FINE, -1, 'the jail fine')) return false;
      p.jail = false; p.jailTurns = 0;
      render();
      await moveSteps(pi, a + b);
      await land(pi, a + b);
      return false;
    }
    log(`${pn(pi)} stays in jail.`);
    render();
    return false;
  }
  const [a, b] = await doRoll(pi);
  const dbl = a === b;
  if (dbl) {
    G.doubles++;
    if (G.doubles >= 3) { log(`Three doubles in a row! ${pn(pi)} is caught speeding.`); await goToJail(pi); return false; }
  }
  await moveSteps(pi, a + b);
  await land(pi, a + b);
  return dbl && !p.jail && !p.out;
}
async function postRoll(pi) {
  const p = P(pi);
  if (p.cpu) {
    cpuManage(pi);
    setStatus(G.extraRoll ? `${esc(p.name)} rolled doubles and goes again.` : `${esc(p.name)} ends their turn.`);
    await sleep(spd().cpu * .7);
    return;
  }
  await ask(pi, {safe:true, manage:true, trade:true,
    prompt:() => G.extraRoll ? 'Doubles! Build, mortgage or trade if you like, then roll again.' : 'Build, mortgage or trade if you like, then end your turn.',
    buttons:() => [G.extraRoll ? {id:'again', label:'Roll again', primary:true} : {id:'end', label:'End turn', primary:true}]});
}
async function playTurn(resume) {
  const pi = G.turn, p = P(pi);
  if (p.out) return;
  let phase = resume === 'post' ? 'post' : 'pre';
  let quick = false;   // a human who just pressed "Roll again" shouldn't have to press Roll a second time
  while (true) {
    if (phase === 'pre') {
      G.phase = 'pre'; save();
      const choice = quick && !p.jail ? 'roll' : await preRoll(pi);
      quick = false;
      const again = await rollPhase(pi, choice);
      if (G.over || p.out) return;
      G.extraRoll = again;
    }
    phase = 'pre';
    G.phase = 'post'; save();
    await postRoll(pi);
    if (G.over || p.out) return;
    if (!G.extraRoll) return;
    quick = !p.cpu;
  }
}
function nextTurn() {
  const n = G.players.length;
  let t = G.turn;
  for (let k = 0; k < n; k++) { t = (t + 1) % n; if (!P(t).out) break; }
  G.turn = t; G.turnNo++; G.doubles = 0; G.extraRoll = false; G.phase = 'pre';
  UI.landed = -1;
  log(`<span class="lt">Turn ${G.turnNo}:</span> ${pn(t)}`);
  render();
}
async function runGame(resume) {
  const gen = GEN;
  try {
    while (!G.over) {
      await playTurn(resume);
      resume = null;
      if (gen !== GEN) return;
      if (G.over) break;
      nextTurn();
    }
    if (gen !== GEN) return;
    clearSave();
    UI.status = '';
    render();
    showGameOver();
  } catch (e) {
    console.error(e);
    if (gen === GEN) infoBox('Something went wrong', `<p>${esc(e && e.message || e)}</p><p class="muted">Your game was saved at the start of this turn. Reload the page to continue from there.</p>`);
  }
}
function startGame(state, resume) {
  GEN++;
  closeAllModals();
  UI.wait = null; UI.manager = null; UI.safe = false; UI.status = ''; UI.landed = -1;
  G = state;
  buildBoard();
  if (!resume && !G.preview) { log(`<span class="lt">Turn 1:</span> ${pn(G.turn)}`); }
  render();
  if (!G.preview) runGame(resume);
}

}

window.SKY = {
  get G() { return G; }, get UI() { return UI; }, TEST, SPACES,
  setSpeed(s) { settings.speed = s; },
  start(seats, rules) { startGame(createState(seats.map((s, k) => ({...SEATS[k], name:s.name || `P${k + 1}`, cpu:!!s.cpu})), rules || {})); },
  check() {
    const errs = [];
    let h = 0, H = 0;
    for (const i of BUYABLE) {
      const o = own(i), sp = SPACES[i];
      if (o.h === 5) H++; else h += o.h;
      if (o.h > 0) {
        if (sp.t !== 'prop') errs.push('buildings on non-street ' + sp.name);
        else {
          const grp = GROUP_IDX[sp.g];
          if (!grp.every(j => own(j).o === o.o)) errs.push('buildings without full set ' + sp.name);
          if (grp.some(j => own(j).m)) errs.push('buildings in mortgaged set ' + sp.name);
        }
      }
      if (o.o >= 0 && P(o.o).out) errs.push('owned by bankrupt player ' + sp.name);
      if (o.o < 0 && (o.h || o.m)) errs.push('bank property with state ' + sp.name);
    }
    if (h + G.houses !== 32) errs.push(`house count ${h}+${G.houses}`);
    if (H + G.hotels !== 12) errs.push(`hotel count ${H}+${G.hotels}`);
    G.players.forEach(p => {
      if (p.money < 0) errs.push(p.name + ' negative cash ' + p.money);
      if (!Number.isInteger(p.money)) errs.push(p.name + ' fractional cash ' + p.money);
      if (p.out && (p.money || p.cards.length)) errs.push(p.name + ' out but holds assets');
    });
    for (const d of ['chance','chest']) {
      const held = G.players.reduce((s, p) => s + p.cards.filter(c => c === d).length, 0);
      if (G.decks[d].length + held !== 16) errs.push('deck size ' + d);
      if (new Set(G.decks[d]).size !== G.decks[d].length) errs.push('duplicate card ' + d);
    }
    return errs;
  },
};

/* =====================================================================
   BOOT
   ===================================================================== */
const preview = createState(SEATS.map((s, k) => ({...s, name:`Player ${k + 1}`})), {});
preview.preview = true;
startGame(preview);
openSetup();
})();
